services:
  tradingagents:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      - ./reports:/app/reports
      - ./eval_results:/app/eval_results
      - ./results:/app/results
    command: ["tradingagents"]
