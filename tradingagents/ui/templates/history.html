{% extends "base.html" %}
{% block title %}TradingAgents History{% endblock %}
{% block content %}
<section class="panel">
    <h2>History</h2>
    <form method="get" action="/history" class="actions" style="margin-bottom: 18px;">
        <input name="ticker" placeholder="Ticker" value="{{ filters.ticker }}">
        <input name="status" placeholder="Status" value="{{ filters.status }}">
        <input name="rating" placeholder="Rating" value="{{ filters.rating }}">
        <button class="button" type="submit">Apply Filters</button>
        <a class="button secondary" href="/">Back</a>
    </form>
    <table>
        <thead>
            <tr>
                <th>Run</th>
                <th>Status</th>
                <th>Rating</th>
                <th>Source</th>
            </tr>
        </thead>
        <tbody>
            {% for run in runs %}
                <tr>
                    <td><a href="/runs/{{ run.run_id }}">{{ run.ticker }}</a><br><span class="meta">{{ run.analysis_date }}</span></td>
                    <td>{{ run.status }}</td>
                    <td>{{ run.rating or "—" }}</td>
                    <td>{{ run.source }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
